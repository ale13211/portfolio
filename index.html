<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alejandro Insfrán | Backend Developer</title>
  <meta name="description" content="Backend Developer en sistemas financieros de alta criticidad. SQL, PL/SQL, Python/Django, JavaScript y Docker." />
  <meta property="og:title" content="Alejandro Insfrán | Backend Developer" />
  <meta property="og:description" content="Sistemas financieros de alta criticidad y productos web de punta a punta." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#05060D" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='14' width='84' height='72' rx='18' fill='%23F97316'/><text x='50' y='64' font-size='38' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'>AI</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Saltar al contenido</a>

  <!-- Escena 3D (fondo fijo) -->
  <canvas id="scene" class="scene" aria-hidden="true"></canvas>
  <div class="stars-fallback" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top" id="brand-name">Alejandro Insfrán</a>
      <nav class="nav" aria-label="Principal">
        <a href="#fortalezas" data-i18n="nav.strengths">Fortalezas</a>
        <a href="#stack" data-i18n="nav.stack">Stack</a>
        <a href="#experiencia" data-i18n="nav.experience">Experiencia</a>
        <a href="#proyectos" data-i18n="nav.projects">Proyectos</a>
        <a href="#contacto" data-i18n="nav.contact">Contacto</a>
      </nav>
      <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
    </div>
  </header>

  <main id="main">
    <!-- HERO -->
    <section class="hero" id="top" data-stage="hero">
      <div class="container">
        <div class="hero-text">
          <p class="hero-hello reveal" data-i18n="hero.hello">Hola, soy</p>
          <h1 class="hero-name reveal" id="hero-name">Alejandro Insfrán</h1>
          <p class="hero-role reveal" data-i18n="hero.role"></p>
          <p class="hero-lead reveal" data-i18n="hero.lead"></p>
          <div class="hero-actions reveal">
            <a class="btn btn-primary" href="#proyectos" data-i18n="hero.cta.projects">Ver proyectos</a>
            <a class="btn btn-ghost" id="cv-link" href="#" download data-i18n="hero.cta.cv">Descargar CV</a>
          </div>
          <p class="hero-status reveal"><span class="dot" aria-hidden="true"></span><span data-i18n="hero.status"></span></p>
        </div>
      </div>
      <a class="scroll-cue" href="#fortalezas" aria-label="Bajar"><span></span></a>
    </section>

    <!-- FORTALEZAS -->
    <section class="section" id="fortalezas" data-stage="aside">
      <div class="container">
        <h2 class="big-title" data-i18n="strengths.title">Lo que hago bien</h2>
        <div class="strengths" id="strengths-list"></div>
      </div>
    </section>

    <!-- SKILLS 3D -->
    <section class="skills-stage" id="stack" data-stage="skills">
      <div class="container skills-head">
        <h2 class="big-title skills-title" data-i18n="stack.title">Skills</h2>
        <p class="skills-hint" data-i18n="skills.hint"></p>
      </div>
      <div class="skill-callout" id="skill-callout" aria-live="polite">
        <p class="skill-callout-name" id="callout-name"></p>
        <p class="skill-callout-phrase" id="callout-phrase"></p>
        <p class="skill-callout-level" id="callout-level"></p>
      </div>
      <div class="container skills-list-wrap no-3d">
        <details class="skills-details" id="skills-details">
          <summary data-i18n="skills.list">Ver como lista</summary>
          <ul class="legend">
            <li><span class="chip chip-daily" aria-hidden="true"></span><span data-i18n="stack.legend.daily"></span></li>
            <li><span class="chip chip-projects" aria-hidden="true"></span><span data-i18n="stack.legend.projects"></span></li>
            <li><span class="chip chip-learning" aria-hidden="true"></span><span data-i18n="stack.legend.learning"></span></li>
          </ul>
          <div class="skills" id="skills-list"></div>
        </details>
      </div>
    </section>

    <!-- EXPERIENCIA -->
    <section class="section" id="experiencia" data-stage="aside">
      <div class="container">
        <h2 class="big-title" data-i18n="experience.title">Experiencia</h2>
        <ol class="timeline" id="experience-list"></ol>
      </div>
    </section>

    <!-- PROYECTOS -->
    <section class="section" id="proyectos" data-stage="projects">
      <div class="container">
        <div class="section-head">
          <h2 class="big-title" data-i18n="projects.title">Proyectos</h2>
          <div class="filters" id="project-filters" role="group" aria-label="Filtrar proyectos"></div>
        </div>
        <div class="projects" id="projects-list"></div>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="section contact" id="contacto" data-stage="contact">
      <div class="container contact-grid">
        <div>
          <h2 class="big-title contact-title" data-i18n="contact.big">Trabajemos juntos</h2>
          <p class="contact-text" data-i18n="contact.text"></p>
          <form class="contact-form" id="contact-form">
            <label>
              <span data-i18n="contact.name">Tu nombre</span>
              <input name="name" type="text" autocomplete="name" required />
            </label>
            <label>
              <span>Email</span>
              <input name="email" type="email" autocomplete="email" required placeholder="nombre@empresa.com" />
            </label>
            <label>
              <span data-i18n="contact.message">Mensaje</span>
              <textarea name="message" rows="4" required></textarea>
            </label>
            <button class="btn btn-primary" type="submit" data-i18n="contact.send">Enviar mensaje</button>
          </form>
          <ul class="contact-links">
            <li><a id="contact-mail" href="#">Email</a></li>
            <li><a id="link-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a></li>
            <li><a id="link-github" href="#" target="_blank" rel="noopener">GitHub</a></li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p id="footer-name"></p>
      <p data-i18n="footer.built"></p>
    </div>
  </footer>

  <dialog class="project-dialog" id="project-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner" id="dialog-content"></div>
  </dialog>

  <script src="data.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
